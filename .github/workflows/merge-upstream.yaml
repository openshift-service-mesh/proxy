name: Merge upstream

on:
  schedule:
    - cron: "10 */12 * * *"
  workflow_dispatch:

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    # Run inside the branch's builder container so `update-deps.sh` (which runs
    # `bazel vendor //:envoy`) analyzes the build against the same host LLVM/clang
    # toolchain the real build uses. On a bare ubuntu-latest runner the host clang
    # version and /usr layout differ, so the host-LLVM alias cannot resolve
    # @llvm_toolchain_llvm//:lib/libLLVM.so.<ver> and vendoring fails during
    # analysis (resetting compiler.bzl afterwards can't help -- analysis runs
    # inside update-deps.sh, before the reset).
    container: ${{ matrix.image }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # image must track each branch's ossm/ci/builder-image (it is evaluated
        # before checkout, so it cannot be read from the repo at run time).
        include:
          - branch: release-1.28
            image: quay.io/maistra-dev/maistra-builder:3.3
          - branch: release-1.30
            image: quay.io/maistra-dev/maistra-builder:3.4
          - branch: release-1.31
            image: quay.io/maistra-dev/maistra-builder:3.5
          - branch: master
            image: quay.io/maistra-dev/maistra-builder:main

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0

    - name: Merge upstream
      run: |
        # The workspace is checked out by a different user than the container
        # runs as; mark it safe so git commands don't abort on dubious ownership.
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        git config user.name "openshift-service-mesh-bot"
        git config user.email "openshiftservicemeshbot@gmail.com"
        git remote add upstream https://github.com/istio/proxy.git
        git fetch upstream ${{ matrix.branch }}
        if ! merge_output=$(git merge upstream/${{ matrix.branch }} 2>&1); then
          conflicts=$(git diff --name-only --diff-filter=U)
          # MODULE.bazel.lock is bzlmod's generated resolution snapshot. It
          # changes on both sides of nearly every sync and its JSON is not
          # meaningfully mergeable, so it conflicts almost every time. Keeping
          # either side is fine: the Update deps step below re-resolves it from
          # the merged MODULE.bazel via `bazel vendor`. Anything else is a real
          # conflict that needs a human.
          if [ "${conflicts}" = "MODULE.bazel.lock" ]; then
            echo "::notice::Auto-resolving MODULE.bazel.lock conflict; it is regenerated by update-deps.sh"
            git checkout --ours -- MODULE.bazel.lock
            git add MODULE.bazel.lock
            # `git commit --no-edit` rather than `git merge --continue`: the
            # latter opens an editor for the merge message, which hangs on CI.
            merge_output=$(git commit --no-edit 2>&1) || {
              echo "::error::Failed to conclude merge:"
              echo "$merge_output"
              exit 1
            }
          else
            echo "::error::Merge failed:"
            echo "$merge_output"
            exit 1
          fi
        fi
        if echo "$merge_output" | grep -q "Already up to date"; then
          echo "already-synced=true" >> "$GITHUB_OUTPUT"
        fi
      id: merge

    - name: Update deps
      if: steps.merge.outputs.already-synced != 'true'
      run: |
        ./ossm/scripts/update-deps.sh

        # Reset the changes to compiler.bzl since we don't want to update it
        # (WORKSPACE mode only, master switched to bazel modules and this is not necessary)
        if [ "${{ matrix.branch }}" != "master" ]; then
          git checkout ossm/vendor/envoy_repo/compiler.bzl || true
        fi

        git add -A
        git commit -m "Update deps" || true

    - name: Create the PR
      if: steps.merge.outputs.already-synced != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ secrets.GIT_TOKEN }}
        branch: merge-upstream-${{ matrix.branch }}
        base: ${{ matrix.branch }}
        title: "[${{ matrix.branch }}] Merge upstream"
        body: "[${{ matrix.branch }}] Merge upstream - Automated"
        commit-message: "[${{ matrix.branch }}] Merge upstream"
        committer: openshift-service-mesh-bot <openshiftservicemeshbot@gmail.com>
        author: openshift-service-mesh-bot <openshiftservicemeshbot@gmail.com>
        labels: |
          auto-merge
          tide/merge-method-merge
