---
name: Handle ok-to-test label

on:
  pull_request_target:
    types: [labeled]
    branches:
      - master

jobs:
  handle-ok-to-test:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'ok-to-test'
    permissions:
      pull-requests: write
      actions: write
    steps:
      - name: Dispatch build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yaml',
              ref: context.payload.pull_request.base.ref,
              inputs: {
                pr_number: String(context.payload.pull_request.number),
                head_sha: context.payload.pull_request.head.sha,
                base_ref: context.payload.pull_request.base.ref,
                source_repo: context.payload.pull_request.head.repo?.clone_url
                  ?? `https://github.com/${context.repo.owner}/${context.repo.repo}.git`
              }
            });

      - name: Remove needs-ok-to-test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'needs-ok-to-test'
            }).catch(() => {});
